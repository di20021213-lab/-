# Охота за редкими дисковыми играми для PS4/PS5.
#
# Идея. Массовые игры на Авито не заработок: их сотни, цена известна всем, маржи
# нет. Заработок — в редких: малым тиражом, давно снятых с продажи, вышедших
# только на диске. Такие появляются раз в недели, и тот, кто узнал первым,
# забирает.
#
# Отсюда устройство конфига: НЕ одна категория целиком, а по отдельному поиску
# на каждую игру. Причина простая — выдача Авито отсортирована по дате и отдаёт
# первые полсотни карточек. В категории «игры для приставок» эти полсотни
# занимает ходовое и цифровой спам, а редкая игра туда просто не попадает,
# сколько её ни фильтруй у себя. Поиск по названию (q=) решает это на стороне
# Авито.
#
# Блоки поисков не пиши руками — их генерирует make_searches.py по списку
# названий, с правильным кодированием запроса и стоп-словами:
#
#   python3 make_searches.py games.txt >> config.yaml
#
# Скопировать себе:  cp config.games.example.yaml config.yaml
#
# СКОЛЬКО ИГР МОЖНО ДОБАВИТЬ. Сколько угодно — но они делят один и тот же
# бюджет запросов. При rotate_# ПОРЯДОК БЛОКОВ ЗДЕСЬ НЕ СЛУЧАЕН. settings идёт первым, а searches последним
# именно затем, чтобы сгенерированные поиски можно было дописывать в КОНЕЦ
# файла:
#
#     cp config.games.example.yaml config.yaml
#     python3 make_searches.py games.example.txt >> config.yaml
#
# Если поменять блоки местами, дописанное уедет внутрь settings и конфиг
# перестанет читаться. YAML порядок ключей верхнего уровня не важен, а вот нам
# важен.

settings:
  # ИНТЕРВАЛ СНИЖЕН — и это гипотеза, которую надо проверить по логу, а не
  # установленный факт.
  #
  # Прежние 20-35 минут выведены в те дни, когда один цикл бил по Авито до
  # шестнадцати запросов: страница выдачи плюс заход на каждого финалиста ради
  # описания. В таком режиме адрес действительно восстанавливался 20-30 минут.
  #
  # Сейчас режим другой: один поиск и check_description: false, то есть РОВНО
  # ОДИН запрос за цикл. Это несопоставимо меньшая нагрузка, и держать под неё
  # получасовую паузу — значит зря терять шансы поймать диск.
  #
  # Ставим 10-18 минут и смотрим лог через сутки:
  #   journalctl -u avito-watcher --since "1 day ago" --no-pager \
  #     | grep -cE "HTTP 429"
  # Блокировок почти нет — можно опустить ещё. Полезли 429 — вернуть 1200/2100.
  # Менять по одному шагу, а не в два раза сразу.
  # По одному поиску за цикл, по очереди. Так число запросов к Авито не растёт
  # с числом поисков — а упираемся мы именно в него.
  # Сводка «я жив» раз в 20 минут — примерно после каждой проверки. Нужна
  # затем, что тишина в Telegram снаружи выглядит одинаково и когда новых
  # объявлений просто нет, и когда бот упал. Запросов к Авито не добавляет:
  # это сообщение в Telegram, а не заход на сайт. Реже — например "6h";
  # совсем выключить — 0.
  heartbeat_every: "20m"
  rotate_searches: true
  poll_interval_min: 600
  poll_interval_max: 1080
  headless: true
  max_notifications_per_cycle: 15

  # Сколько страниц объявлений за цикл разрешено открыть ради описания.
  # При check_description: false не задействовано вовсе и лежит здесь на случай,
  # если ты его включишь. Именно этот расход сжёг адрес на видеокартах: без
  # ограничения цикл открывал страницу каждого финалиста.
  max_detail_fetches_per_cycle: 3

  request_timeout_ms: 45000

searches: true за цикл проверяется ровно ОДИН
# поиск, по очереди. То есть нагрузка на адрес не зависит от числа игр, а вот
# частота проверки каждой — делится: двадцать названий при цикле в 10-18 минут
# это проверка каждой игры раз в 3-6 часов. Для вещи, которая появляется раз в
# месяц, этого с запасом. Гнаться за минутами тут не за чем.
#
# ПРО НАГРУЗКУ. Адрес общий, и это проверено: трассировка с мини-ПК показала
# переход на 100.64.32.4 — диапазон 100.64.0.0/10, то есть CGNAT провайдера.
# Публичный адрес делится с другими абонентами, и бюджет запросов к Авито
# расходуешь не только ты. Белый IP провайдер подключить отказался.
# Отсюда check_description: false и один поиск за цикл.
#
# Про user=1. Магазины Авито показывает БЕЗ даты публикации: вместо неё в
# карточке «Рассрочка» и «Доставка». Возраст такого объявления определить
# нельзя, и висят такие месяцами. Плюс это розница, а не то, что ищут по
# объявлениям. Если поиск захлёбывается магазинами — добавь &user=1 в URL.
#
# Про объявления без даты. Авито показывает относительную дату примерно неделю,
# дальше её в карточке нет. Но выдача отсортирована по дате, поэтому объявление
# без даты, стоящее ниже датированного, заведомо не моложе него — по этому и
# отсеиваем.
#
# ВАЖНО про «договорная»: объявления без цены отсеиваются, пока задан max_price —
# понять, влезают ли они в потолок, невозможно. Хочешь видеть и их — убери
# max_price и оставь только pmax в URL.

# Поисков здесь намеренно НЕТ НИ ОДНОГО. Pragmata убрана: игра вышла, рынок
# насытился, и за сутки по ней приходило 81 уведомление при цене 3500-4000 —
# это уже не охота, а лента.
#
# Свои поиски собери генератором, он допишет их сюда:
#
#     python3 make_searches.py games.example.txt >> config.yaml
#
# А чтобы список игр был не из головы, а по факту — сначала прочеши рынок:
#
#     python3 scan_market.py games.example.txt
#     python3 scan_market.py --report
#
# Он обойдёт названия, посмотрит, что из этого водится на Авито и почём, и
# покажет, где есть разброс цен. Следить имеет смысл за тем, что появляется
# редко, но с широким разбросом: именно там встречается недооценённое.
searches:
