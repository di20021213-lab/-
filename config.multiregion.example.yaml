# Несколько соседних областей одним ботом.
#
# Каждая область — отдельный поиск: у Авито нет URL «искать сразу по нескольким
# регионам», поэтому их приходится перечислять. База виденных объявлений ведётся
# по label, так что одно и то же объявление из разных поисков не задвоится —
# у них разные ID и разные регионы.
#
# Скопировать себе:  cp config.multiregion.example.yaml config.yaml
#
# Что настроено ниже:
#   · у видеокарт потолок 3000 ₽ и без нижней границы, у диска 1000-4200 ₽:
#     дешевле тысячи бывает только цифра, дороже 4200 покупать нет смысла;
#   · только опубликованные за последний час;
#   · нерабочие приходят с пометкой ⚠️, а не скрываются (on_broken: flag);
#   · user=1 в URL — только частные объявления, без магазинов.
#
# ПРО НАГРУЗКУ. Домашний адрес у большинства провайдеров — общий (CGNAT), и
# бюджет запросов к Авито на нём маленький: его расходуешь не только ты. Отсюда
# редкий интервал, две области вместо четырёх и check_description: false.
# Ослаблять всё это стоит по одному пункту за раз, поглядывая в лог на 429.
#
# ПРО ЧИСЛО ОБЛАСТЕЙ. Здесь она одна. На двух домашний адрес давал 10
# блокировок на 3 удачные проверки, на четырёх — ещё хуже. На четырёх домашний IP упирался в 429:
# каждая область — это отдельная страница выдачи за цикл, и Авито считает
# запросы по адресу. Хочешь добавить соседние (Курская, Липецкая) — добавляй
# по одной и смотри лог на 429, а не все разом.
#
# Про user=1. Магазины Авито показывает БЕЗ даты публикации: вместо неё в
# карточке «Рассрочка» и «Доставка». Возраст такого объявления определить
# нельзя, фильтр свежести к нему не применяется, и оно проходит вперёд —
# а висят такие месяцами. Плюс это розница, а не то, что ищут по объявлениям.
# Поэтому магазины отсекаем прямо в URL.
#
# Про объявления без даты. Авито показывает относительную дату примерно неделю,
# дальше её в карточке нет. Но выдача отсортирована по дате, поэтому объявление
# без даты, стоящее ниже датированного, заведомо не моложе него — по этому и
# отсеиваем. require_age (отбрасывать всё без даты) при такой оценке не нужен:
# он заодно выбрасывал бы и свежее объявление, если дату разок не прочитали.
#
# ВАЖНО про «договорная»: объявления без цены отсеиваются, пока задан max_price —
# понять, влезают ли они в потолок, невозможно. Хочешь видеть и их — убери
# max_price и оставь только pmax в URL.

searches:
  # Видеокарты временно отключены — раскомментируй блок, чтобы вернуть.
  # База виденных объявлений сохранилась, так что старьём не завалит:
  # придёт только то, что появится после включения.
  # - label: "Видеокарты Орловская обл."
  #   url: "https://www.avito.ru/orlovskaya_oblast/tovary_dlya_kompyutera/komplektuyuschie/videokarty?pmax=3000&s=104&user=1"
  #   max_price: 3000
  #   max_age: "1h"
  #   on_broken: flag
  #   # Не открывать страницу каждого объявления: это половина всех запросов к
  #   # Авито, а на общем IP их бюджет мал. Признаки неисправности ищем в
  #   # заголовке и в тексте карточки — там обычно виден кусок описания.
  #   check_description: false

  # Охота за конкретной вещью, а не за категорией — настройки другие.
  # По всей России: диск едет почтой, а в одной области такое объявление может
  # не появиться месяцами. Окно — сутки: тут задача не успеть первым, а не
  # пропустить вовсе; база всё равно не пришлёт одно объявление дважды.
  - label: "Pragmata PS5 (диск)"
    # Поиск по всему сайту, а не по разделу игр: продавец мог положить диск
    # в «Игры и программы», в «Прочее» или ещё куда — по названию найдём везде.
    # От постороннего страхуют keywords ниже.
    # pmin в URL обязателен, а не только min_price у нас. Иначе Авито отдаёт
    # первые 50 по дате, и все 50 занимает цифровой спам по 350 ₽ — его
    # публикуют по десяткам городов непрерывно. Мы бы его исправно отсеивали,
    # но настоящий диск в эти 50 просто не попадал бы.
    url: "https://www.avito.ru/all?q=pragmata&pmin=1000&pmax=4200&s=104&user=1"
    max_price: 4200
    # max_age тут почти декоративен: в поиске по всему сайту Авито не показывает
    # даты вовсе, так что проверять свежесть не по чему. Дублей не будет —
    # их не пускает база виденных.
    max_age: "1d"
    on_broken: flag
    check_description: false
    # Подстраховка на случай, если поиск Авито подмешает что-то постороннее.
    keywords: ["pragmata", "прагмата"]
    # Отсекаем цифровые копии и аккаунты: их продают одинаковым текстом по всей
    # стране за 300-700 ₽, и они забивают выдачу. Нужен физический диск.
    # «на русском» сюда НЕ добавляем: этой фразой помечают цифровые копии, но
    # её же может написать и продавец диска — а терять нужное объявление хуже,
    # чем получить лишнее. Дешёвую цифру и так отсекает min_price.
    # «п3»/«п2» — принятое на Авито обозначение типа аккаунта. Как подстрока в
    # русском тексте не встречается, так что ложных срабатываний не даёт.
    exclude_keywords: ["аккаунт", "цифров", "ключ", "активац", "подписк",
                       "steam", "оффлайн", "offline", "п3", "п2"]
    # Диск новой игры дешевле тысячи не бывает — это верный признак цифры.
    min_price: 1000
    # Встроенный словарь заточен под видеокарты; для диска важно другое.
    extra_broken_markers: ["царапин", "не читается", "нечитаем", "без диска", "только коробка"]

settings:
  # Интервал поднят по сравнению с одним поиском: за цикл бот открывает четыре
  # страницы выдачи вместо одной, плюс страницы объявлений-финалистов. На
  # 240-420 мы ловили 429, поэтому берём с запасом. Каждая область при этом
  # проверяется раз в 5-10 минут — при max_age в час этого с избытком.
  # Интервал подобран по логам: бюджет домашнего адреса восстанавливается за
  # 20-30 минут тишины, а одна загрузка страницы съедает почти весь. Чаще —
  # и проверки глохнут в 429. При max_age в час у объявления всё равно
  # остаётся две возможности попасться.
  # По одному поиску за цикл, по очереди. Так число запросов к Авито не растёт
  # с числом категорий — а упирается мы именно в него, а не в количество
  # поисков. Каждая категория при этом проверяется раз в 40-70 минут.
  rotate_searches: true
  poll_interval_min: 1200
  poll_interval_max: 2100
  headless: true
  max_notifications_per_cycle: 15
  request_timeout_ms: 45000
