# Охота за диском Pragmata PS5.
#
# Сейчас здесь ОДИН живой поиск — диск. Видеокарты ниже закомментированы:
# рынок старых карт оказался слишком кривым, чтобы на нём что-то ловить.
# Вернуть их — раскомментировать блок; база виденных сохранилась, так что
# старьём не завалит, придёт только то, что появится после включения.
#
# Скопировать себе:  cp config.multiregion.example.yaml config.yaml
#
# Что настроено ниже:
#   · у видеокарт потолок 3000 ₽ и без нижней границы, у диска 1000-4200 ₽:
#     дешевле тысячи бывает только цифра, дороже 4200 покупать нет смысла;
#   · у видеокарт — только опубликованные за последний час; у диска окна
#     нет вовсе, он редкий и трёхдневное объявление ещё живо;
#   · нерабочие приходят с пометкой ⚠️, а не скрываются (on_broken: flag);
#   · user=1 в URL — только частные объявления, без магазинов.
#
# ПРО НАГРУЗКУ. Раньше здесь стояла догадка, что адрес общий. Теперь это
# ПРОВЕРЕНО: трассировка с мини-ПК показала переход на 100.64.32.4 — диапазон
# 100.64.0.0/10, то есть CGNAT провайдера. Публичный адрес делится с другими
# абонентами, и бюджет запросов к Авито расходуешь не только ты. Белый IP
# провайдер подключить отказался.
#
# Отсюда весь режим экономии: check_description: false и один поиск за цикл.
# Ослаблять стоит по одному пункту за раз, поглядывая в лог на 429.
#
# ПРО ЧИСЛО ПОИСКОВ. Здесь он один, и это главное, что мы можем сделать для
# адреса. На двух поисках он давал 10 блокировок на 3 удачные проверки, на
# четырёх — ещё хуже: каждый поиск это отдельная страница выдачи за цикл, а
# Авито считает запросы по адресу. Добавлять — по одному, глядя в лог.
#
# Про user=1. Магазины Авито показывает БЕЗ даты публикации: вместо неё в
# карточке «Рассрочка» и «Доставка». Возраст такого объявления определить
# нельзя, фильтр свежести к нему не применяется, и оно проходит вперёд —
# а висят такие месяцами. Плюс это розница, а не то, что ищут по объявлениям.
# Поэтому магазины отсекаем прямо в URL.
#
# Про объявления без даты. Авито показывает относительную дату примерно неделю,
# дальше её в карточке нет. Но выдача отсортирована по дате, поэтому объявление
# без даты, стоящее ниже датированного, заведомо не моложе него — по этому и
# отсеиваем. require_age (отбрасывать всё без даты) при такой оценке не нужен:
# он заодно выбрасывал бы и свежее объявление, если дату разок не прочитали.
#
# ВАЖНО про «договорная»: объявления без цены отсеиваются, пока задан max_price —
# понять, влезают ли они в потолок, невозможно. Хочешь видеть и их — убери
# max_price и оставь только pmax в URL.

searches:
  # Видеокарты временно отключены — раскомментируй блок, чтобы вернуть.
  # База виденных объявлений сохранилась, так что старьём не завалит:
  # придёт только то, что появится после включения.
  # - label: "Видеокарты Орловская обл."
  #   url: "https://www.avito.ru/orlovskaya_oblast/tovary_dlya_kompyutera/komplektuyuschie/videokarty?pmax=3000&s=104&user=1"
  #   max_price: 3000
  #   max_age: "1h"
  #   on_broken: flag
  #   # Не открывать страницу каждого объявления: это половина всех запросов к
  #   # Авито, а на общем IP их бюджет мал. Признаки неисправности ищем в
  #   # заголовке и в тексте карточки — там обычно виден кусок описания.
  #   check_description: false

  # Охота за конкретной вещью, а не за категорией — настройки другие.
  # По всей России: диск едет почтой, а в одной области такое объявление может
  # не появиться месяцами. Окна свежести нет совсем (см. max_age ниже): тут
  # задача не успеть первым, а не пропустить вовсе.
  - label: "Pragmata PS5 (диск)"
    # Поиск по всему сайту, а не по разделу игр: продавец мог положить диск
    # в «Игры и программы», в «Прочее» или ещё куда — по названию найдём везде.
    # От постороннего страхуют keywords ниже.
    # pmin в URL обязателен, а не только min_price у нас. Иначе Авито отдаёт
    # первые 50 по дате, и все 50 занимает цифровой спам по 350 ₽ — его
    # публикуют по десяткам городов непрерывно. Мы бы его исправно отсеивали,
    # но настоящий диск в эти 50 просто не попадал бы.
    # Ссылка взята из приложения Авито, где диски видны своими глазами, —
    # собирать её по догадкам оказалось безнадёжно. Что важно и неочевидно:
    #   · хеш в адресе раздела кодирует подкатегорию, руками не составить;
    #   · поиск идёт от Орла, объявления из других городов попадают по доставке;
    #   · слово «диск» в запросе само отсекает цифру — у неё в заголовке
    #     «Русская Озвучка», а не «диск».
    # Цены НЕ ставим в URL: pmin на этом поиске возвращал пустую выдачу.
    # Диапазон 1000-4200 отрабатывает уже у нас, ниже.
    url: "https://www.avito.ru/orel/igry_pristavki_i_programmy/igry_dlya_pristavok-ASgBAgICAUSSAsYJ?q=pragmata%20ps5%20%D0%B4%D0%B8%D1%81%D0%BA&s=104"
    max_price: 4200
    # max_age тут НЕ задан — и это осознанно. Сначала стояли сутки: я думал, что
    # дат в этой выдаче не будет вовсе. Даты оказались на месте (51 карточка из
    # 54), и фильтр начал резать именно то, ради чего всё затевалось: диски за
    # 3300-3799 ₽ из Сочи, Уфы и Нижнего отсеивались с «старше max_age (3 д)».
    # Задача этого поиска — не успеть первым, а не пропустить вовсе: диск редкий,
    # трёхдневное объявление живо и его можно купить. Повторов бояться нечего —
    # база виденных не пришлёт одно объявление дважды.
    on_broken: flag
    check_description: false
    # Подстраховка на случай, если поиск Авито подмешает что-то постороннее.
    keywords: ["pragmata", "прагмата"]
    # Отсекаем цифровые копии и аккаунты: их продают одинаковым текстом по всей
    # стране за 300-700 ₽, и они забивают выдачу. Нужен физический диск.
    # «на русском» сюда НЕ добавляем: этой фразой помечают цифровые копии, но
    # её же может написать и продавец диска — а терять нужное объявление хуже,
    # чем получить лишнее. Дешёвую цифру и так отсекает min_price.
    # «п3»/«п2» — принятое на Авито обозначение типа аккаунта. Как подстрока в
    # русском тексте не встречается, так что ложных срабатываний не даёт.
    exclude_keywords: ["аккаунт", "цифров", "ключ", "активац", "подписк",
                       "steam", "оффлайн", "offline", "п3", "п2"]
    # Диск новой игры дешевле тысячи не бывает — это верный признак цифры.
    min_price: 1000
    # Готовый текст продавцу. Приходит в уведомлении отдельным блоком, который
    # Telegram копирует одним касанием: скопировал, открыл ссылку, вставил,
    # отправил. Отправляешь ТЫ — бот сам никому не пишет, это запрещено
    # правилами Авито и ведёт к блокировке аккаунта.
    # Коротко и по-человечески: длинные заготовки читаются как рассылка.
    # Доступны подстановки {title}, {price}, {location}. Пустая строка — убрать.
    message_template: "Здравствуйте! Диск ещё продаётся? Готов забрать сегодня."
    # Встроенный словарь заточен под видеокарты; для диска важно другое.
    extra_broken_markers: ["царапин", "не читается", "нечитаем", "без диска", "только коробка"]

settings:
  # ИНТЕРВАЛ СНИЖЕН — и это гипотеза, которую надо проверить по логу, а не
  # установленный факт.
  #
  # Прежние 20-35 минут выведены в те дни, когда один цикл бил по Авито до
  # шестнадцати запросов: страница выдачи плюс заход на каждого финалиста ради
  # описания. В таком режиме адрес действительно восстанавливался 20-30 минут.
  #
  # Сейчас режим другой: один поиск и check_description: false, то есть РОВНО
  # ОДИН запрос за цикл. Это несопоставимо меньшая нагрузка, и держать под неё
  # получасовую паузу — значит зря терять шансы поймать диск.
  #
  # Ставим 10-18 минут и смотрим лог через сутки:
  #   journalctl -u avito-watcher --since "1 day ago" --no-pager \
  #     | grep -cE "HTTP 429"
  # Блокировок почти нет — можно опустить ещё. Полезли 429 — вернуть 1200/2100.
  # Менять по одному шагу, а не в два раза сразу.
  # По одному поиску за цикл, по очереди. Так число запросов к Авито не растёт
  # с числом поисков — а упираемся мы именно в него.
  # Сводка «я жив» раз в 20 минут — примерно после каждой проверки. Нужна
  # затем, что тишина в Telegram снаружи выглядит одинаково и когда новых
  # объявлений просто нет, и когда бот упал. Запросов к Авито не добавляет:
  # это сообщение в Telegram, а не заход на сайт. Реже — например "6h";
  # совсем выключить — 0.
  heartbeat_every: "20m"
  rotate_searches: true
  poll_interval_min: 600
  poll_interval_max: 1080
  headless: true
  max_notifications_per_cycle: 15

  # Сколько страниц объявлений за цикл разрешено открыть ради описания.
  # При check_description: false не задействовано вовсе и лежит здесь на случай,
  # если ты его включишь. Именно этот расход сжёг адрес на видеокартах: без
  # ограничения цикл открывал страницу каждого финалиста.
  max_detail_fetches_per_cycle: 3

  request_timeout_ms: 45000
