# Несколько соседних областей одним ботом.
#
# Каждая область — отдельный поиск: у Авито нет URL «искать сразу по нескольким
# регионам», поэтому их приходится перечислять. База виденных объявлений ведётся
# по label, так что одно и то же объявление из разных поисков не задвоится —
# у них разные ID и разные регионы.
#
# Скопировать себе:  cp config.multiregion.example.yaml config.yaml
#
# Что настроено ниже:
#   · потолок 3000 ₽, нижней границы нет (иногда интересное отдают совсем дёшево);
#   · только опубликованные за последний час;
#   · нерабочие приходят с пометкой ⚠️, а не скрываются (on_broken: flag);
#   · user=1 в URL — только частные объявления, без магазинов.
#
# ПРО ЧИСЛО ОБЛАСТЕЙ. Здесь их две. На четырёх домашний IP упирался в 429:
# каждая область — это отдельная страница выдачи за цикл, и Авито считает
# запросы по адресу. Хочешь добавить соседние (Курская, Липецкая) — добавляй
# по одной и смотри лог на 429, а не все разом.
#
# Про user=1. Магазины Авито показывает БЕЗ даты публикации: вместо неё в
# карточке «Рассрочка» и «Доставка». Возраст такого объявления определить
# нельзя, фильтр свежести к нему не применяется, и оно проходит вперёд —
# а висят такие месяцами. Плюс это розница, а не то, что ищут по объявлениям.
# Поэтому магазины отсекаем прямо в URL.
#
# Про объявления без даты. Авито показывает относительную дату примерно неделю,
# дальше её в карточке нет. Но выдача отсортирована по дате, поэтому объявление
# без даты, стоящее ниже датированного, заведомо не моложе него — по этому и
# отсеиваем. require_age (отбрасывать всё без даты) при такой оценке не нужен:
# он заодно выбрасывал бы и свежее объявление, если дату разок не прочитали.
#
# ВАЖНО про «договорная»: объявления без цены отсеиваются, пока задан max_price —
# понять, влезают ли они в потолок, невозможно. Хочешь видеть и их — убери
# max_price и оставь только pmax в URL.

searches:
  - label: "Видеокарты Орловская обл."
    url: "https://www.avito.ru/orlovskaya_oblast/tovary_dlya_kompyutera/komplektuyuschie/videokarty?pmax=3000&s=104&user=1"
    max_price: 3000
    max_age: "1h"
    on_broken: flag

  - label: "Видеокарты Тульская обл."
    url: "https://www.avito.ru/tulskaya_oblast/tovary_dlya_kompyutera/komplektuyuschie/videokarty?pmax=3000&s=104&user=1"
    max_price: 3000
    max_age: "1h"
    on_broken: flag

settings:
  # Интервал поднят по сравнению с одним поиском: за цикл бот открывает четыре
  # страницы выдачи вместо одной, плюс страницы объявлений-финалистов. На
  # 240-420 мы ловили 429, поэтому берём с запасом. Каждая область при этом
  # проверяется раз в 5-10 минут — при max_age в час этого с избытком.
  poll_interval_min: 300
  poll_interval_max: 600
  headless: true
  max_notifications_per_cycle: 15
  request_timeout_ms: 45000
