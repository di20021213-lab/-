# Старые видеокарты: до 1060-го поколения включительно.
#
# Почему это лучше ложится на бота, чем охота за свежими объявлениями.
# Домашний адрес даёт заход на Авито раз в 20-30 минут — это измерено, и
# обойти нельзя. На горячих лотах такой темп означает опоздание. А GTX 960 за
# три тысячи никто не расхватывает за десять минут: покупателей мало, и часто
# продавец сам не знает цену. Выигрывает не первый, а тот, кто знает рынок.
#
# Скопировать себе:  cp config.oldgpu.example.yaml config.yaml
#
# ГЛАВНОЕ — потолки заданы ПО МОДЕЛЯМ. Одной цифрой тут не обойтись: 4000 ₽ —
# находка для 1060 6GB и переплата для 750 Ti.
#
# ПОРЯДОК ПРАВИЛ ЗНАЧИМ. Проверяются сверху вниз, побеждает первое совпавшее.
# Поэтому «1060 6gb» стоит выше, чем «1060»: иначе шестигигабайтную оценят по
# потолку трёхгигабайтной и она пройдёт как «находка», хотя это обычная цена.
#
# ЦИФРЫ НИЖЕ — ЗАГЛУШКИ. Поставь свои. Не знаешь рынок — оставь щедрые
# потолки на неделю, потом посмотри `python report.py`: он покажет медиану по
# каждой модели, и уже по ней выставишь настоящие.

searches:
  - label: "Старые видеокарты"
    # Ссылка взята из приложения Авито — собирать по догадкам бесполезно,
    # на этом уже потерян день. Что я в ней поменял и почему:
    #
    #   m.avito.ru -> www.avito.ru
    #       Мобильная версия отдаёт другую вёрстку, а наш разбор написан под
    #       обычную. Раздел с хешем (videokarty-ASgB...) при этом сохраняем
    #       как есть: он кодирует подкатегорию, руками такой не составить.
    #
    #   добавлено s=104
    #       Сортировка по дате. На ней держится вся логика свежести: бот
    #       считает, что объявление ниже датированного не моложе него.
    #
    #   убран context=...
    #       Одноразовая метка сессии приложения. Со временем протухает и может
    #       начать отдавать пустую выдачу.
    #
    #   orel -> rossiya, radius убран
    #       Поиск по всей стране. Регион в ссылке Авито — это сегмент пути,
    #       менять достаточно его; хеш раздела остаётся прежним.
    #       Хочешь вернуть только свой город — поставь обратно
    #       /orel/ и добавь &radius=0.
    url: "https://www.avito.ru/rossiya/tovary_dlya_kompyutera/komplektuyuschie/videokarty-ASgBAgICAkTGB~pm7gmmZw?s=104"

    # Нижняя граница общая: дешевле этого — либо мусор, либо развод.
    # По всей стране этот порог особенно важен: объявлений в разы больше,
    # и дешёвого хлама тоже.
    min_price: 500

    # Окна свежести нет: тут задача не успеть первым, а не пропустить.
    # Дублей не будет, их не пускает база виденных.

    models:
      # === ПЕРЕМАРКИРОВАННОЕ И МАЙНИНГОВОЕ — СТРОГО ПЕРВЫМИ ===
      # Правила проверяются сверху вниз, и эти обязаны стоять выше обычных:
      # иначе «RX 580 8gb 2048sp» попадёт под правило RX 580 и будет судиться
      # по её потолку, а это совсем другая карта и другие деньги.

      # У настоящей RX 580 стрим-процессоров 2304. Вариант на 2048 — это
      # переделанная RX 470 под именем 580. Продаётся дешевле, и её обычная
      # цена не должна выглядеть находкой.
      - name: "RX 580 2048SP (это 470)"
        match: ["2048sp", "2048 sp", "sp 2048", "sp2048"]
        max_price: 2500

      # Майнинговые: видеовыхода нет вовсе, в монитор не воткнуть. Продают их
      # как «1060» и «1070», покупатель узнаёт правду уже дома.
      #
      # Потолок 1500 был моей выдумкой и оказался ниже рынка: из трёх
      # объявлений в базе (2000 в Елабуге, 1648 в Ногинске, 1500 в Челябинске)
      # проходило ровно одно, поэтому P106 и «не кидались». 2200 — выше всей
      # наблюдаемой полосы 1500-2000: рынок теперь виден целиком, но карта
      # без видеовыхода всё равно не сможет притвориться выгодной 1060.
      - name: "Майнинговая P106"
        match: ["p106"]
        max_price: 2200        # видели 1500-2000 (3 объявления)
      # P104-100 8GB и P102-100 10GB крупнее и дороже P106, своих данных по
      # ним пока нет ни одного объявления. Цифры ориентировочные — как
      # наберутся, поправь по report.py, как и всё остальное ниже.
      - name: "Майнинговая P104/P102"
        match: ["p104", "p102"]
        max_price: 3500        # данных пока нет

      # ПОТОЛКИ ПРЕДВАРИТЕЛЬНЫЕ. Подняты по первой сотне объявлений со всей
      # России — мои прежние цифры оказались ниже рынка и не пропускали
      # вообще ничего. Но по каждой модели там было от одного до трёх
      # объявлений, а по одному судить нельзя. Через два-три дня запусти
      # `python report.py` и выстави по колонке «советую»: она считает
      # нижнюю четверть цен, то есть проходить будет примерно каждое
      # четвёртое — и это будет действительно дёшево, а не обычная цена.
      - name: "GTX 1060 6GB"
        match: ["1060 6", "1060 6gb", "1060 6 gb"]
        max_price: 6000        # видели 7989
      - name: "GTX 1060 3GB"
        match: ["1060"]          # всё остальное, где есть 1060
        max_price: 4500        # видели 5000-5500
      - name: "GTX 1050 Ti"
        match: ["1050 ti", "1050ti"]
        max_price: 4000        # видели 5500
      - name: "GTX 1050"
        match: ["1050"]
        max_price: 2500        # видели 2500-3500
      - name: "GTX 970"
        match: ["970"]
        max_price: 6000        # видели 8000
      - name: "GTX 960"
        match: ["960"]
        max_price: 2200        # видели 2700
      - name: "GTX 950"
        match: ["950"]
        max_price: 1800        # данных пока нет
      - name: "GTX 750 Ti"
        match: ["750 ti", "750ti"]
        max_price: 1500        # данных пока нет
      # Потолки ниже подняты по реальной выдаче из Орла: RX 580 8GB там
      # стоит 8000, RX 480 8GB — 7800. Мои прежние 4000 отсеивали рынок
      # целиком. Уточни по себе, когда наберётся неделя данных в report.py.
      # У RX 570 и RX 560 данных пока нет вовсе: то, что попало в первый
      # отчёт под этими именами, было RX 5700 XT и RX 5600 XT — ошибка
      # сопоставления, уже исправленная. Цифры ниже — ориентир по рынку,
      # уточним по отчёту.
      - name: "RX 570"
        match: ["570"]
        max_price: 5000
      - name: "RX 580 8GB"
        match: ["580 8", "580 8gb"]
        max_price: 6500
      - name: "RX 580"
        match: ["580"]
        max_price: 5500
      - name: "RX 480"
        match: ["480"]
        max_price: 6000
      - name: "RX 560"
        match: ["560"]
        max_price: 3000

    # Нерабочие показываем с пометкой, а не прячем: битую карту иногда берут
    # на запчасти осознанно. Хочешь не видеть вовсе — поставь skip.
    on_broken: flag

    # Страницу объявления не открываем: каждый такой заход тратит бюджет
    # адреса, а он у нас в обрез. Признаки ищем в заголовке и тексте карточки.
    #
    # ВКЛЮЧЕНО. Бот открывает страницу финалиста и читает описание — там
    # находится то, о чём молчит заголовок: «2048sp» у перемаркированных
    # RX 580, отсутствие видеовыхода у майнинговых, следы фермы.
    #
    # Ровно этим мы себе адрес и сожгли. Предупреждение стояло здесь же — «если
    # финалистов станет много, верни false» — а потом мы подняли потолки, и
    # финалистов стало много. В ночь на 14 сентября из 17 заходов 12 упёрлись
    # в 429, и пять часов подряд Авито нас не пускал вовсе.
    #
    # Само по себе чтение описания не виновато: виновато то, что цикл бил
    # очередью до полутора десятков запросов. Теперь заходы ограничены
    # настройкой max_detail_fetches_per_cycle и разнесены во времени, поэтому
    # проверку можно оставить включённой. Остальные объявления приходят с
    # честной пометкой «не проверено».
    check_description: true

    # Явный мусор и не то.
    exclude_keywords: ["нерабоч", "на запчасти", "не работает", "донор",
                       "заглушка", "райзер", "куплю", "обмен"]

    # Признаки, важные именно для видеокарт. Майнинг сюда добавлен намеренно:
    # 1050 Ti, 1060 и RX 570/580 массово стояли на фермах, и такая карта
    # изношена сильнее. Это не запрет, а пометка ⚠️ — решать тебе.
    extra_broken_markers: ["майнинг", "с фермы", "майнила", "артефакт",
                           "перегрев", "не греется", "под ремонт", "требует ремонта",
                           # Перемаркировка и майнинговые — на случай, если в
                           # заголовке этого нет, а в описании есть. Сработают
                           # только при check_description: true.
                           "2048sp", "2048 sp", "sp 2048",
                           "p106", "p104", "без видеовыхода", "нет видеовыхода"]

    message_template: "Здравствуйте! Видеокарта ещё продаётся? Готов забрать сегодня."

settings:
  rotate_searches: true
  poll_interval_min: 1200
  poll_interval_max: 2100
  headless: true
  heartbeat_every: "6h"
  max_notifications_per_cycle: 15

  # Сколько страниц объявлений за цикл разрешено открыть ради описания.
  # Главный расход бюджета адреса: выдача — это один запрос, а дальше по
  # запросу на каждого финалиста. Три — это четыре запроса за цикл вместо
  # шестнадцати. Мало объявлений и адрес держит — можно поднять; ловишь
  # 429 — опусти до 1 или выключи check_description вовсе.
  max_detail_fetches_per_cycle: 3
  request_timeout_ms: 45000
