name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка синтаксиса (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          'programs.json', 'presets.json' | ForEach-Object { Get-Content $_ -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null }
          Write-Host 'Синтаксис в порядке'

      - name: Модульные и сквозные тесты (реальная тихая установка)
        shell: powershell
        run: .\tests\Run-Tests.ps1 -E2E

      - name: Проверка окна программы
        shell: powershell
        run: |
          $out = & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\SilentInstaller.ps1 -SmokeTest 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'SMOKE: rows=\d+') { throw 'Окно программы не создалось' }

      - name: Логи установки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: Logs/
          if-no-files-found: ignore

  package:
    name: Сборка архива
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Собрать SilentInstaller.zip
        run: |
          mkdir -p dist/SilentInstaller
          cp -r SilentInstaller.ps1 Start.bat Install-All.bat programs.json presets.json README.md lib Distrib dist/SilentInstaller/
          cd dist && zip -r SilentInstaller.zip SilentInstaller

      - uses: actions/upload-artifact@v4
        with:
          name: SilentInstaller
          path: dist/SilentInstaller/

      - name: Опубликовать релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SilentInstaller.zip
          generate_release_notes: true
