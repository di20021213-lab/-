name: PDF to Word - build EXE

# Builds PDFtoWord.exe for Windows with Tesseract OCR and the Russian model
# inside (works offline). The ready file is in the run's artifacts:
# Actions tab -> latest run -> Artifacts -> PDFtoWord.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/trusting-darwin-15l7uq
    paths:
      - "pdf2word/**"
      - "pdf2word_app.py"
      - "tests/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/pdf2word.yml"

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract, models and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr fonts-liberation
          mkdir -p tessdata
          for l in rus eng osd; do
            curl -sSfL -o tessdata/$l.traineddata https://github.com/tesseract-ocr/tessdata_best/raw/main/$l.traineddata
          done
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recognize a synthetic scan
        env:
          PDF2WORD_TESSDATA: ${{ github.workspace }}/tessdata
        run: |
          python tests/make_scan.py test_scan.pdf
          python -m pdf2word test_scan.pdf -o result.docx
          python tests/check_docx.py result.docx test_scan.txt

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Tesseract OCR (UB Mannheim build)
        shell: pwsh
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ProgressPreference = "SilentlyContinue"
          $dest = "C:\Tesseract-OCR"
          try {
            # the installer is unpacked with 7-Zip instead of being run:
            # a silent NSIS install can hang on a hidden dialog
            $headers = @{ "User-Agent" = "pdf2word-ci"; "Authorization" = "Bearer $env:GH_TOKEN" }
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/UB-Mannheim/tesseract/releases/latest" -Headers $headers
            $asset = $rel.assets | Where-Object { $_.name -like "*w64-setup*.exe" } | Select-Object -First 1
            Write-Host "Installer:" $asset.name $asset.size
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile tesseract-setup.exe
            7z x -y "-o$dest" tesseract-setup.exe | Out-Null
            $found = Get-ChildItem $dest -Recurse -Filter tesseract.exe | Select-Object -First 1
            if ($found) { $dest = $found.DirectoryName }
          } catch {
            Write-Host "Download or unpack failed: $_"
          }
          if (-not (Test-Path "$dest\tesseract.exe")) {
            Write-Host "Falling back to chocolatey"
            $p = Start-Process choco -ArgumentList "install", "tesseract", "-y", "--no-progress" -PassThru -NoNewWindow
            if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "choco install timed out" }
            $dest = "C:\Program Files\Tesseract-OCR"
          }
          if (-not (Test-Path "$dest\tesseract.exe")) { throw "tesseract.exe not found" }
          Write-Host "Tesseract in" $dest
          Get-ChildItem $dest | Format-Table Name, Length
          & "$dest\tesseract.exe" --version

          # bundle: tesseract.exe + DLLs + our models
          New-Item -ItemType Directory -Force -Path bundle\tesseract\tessdata | Out-Null
          Copy-Item "$dest\tesseract.exe" bundle\tesseract\
          Copy-Item "$dest\*.dll" bundle\tesseract\
          foreach ($l in @("rus", "eng", "osd")) {
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_best/raw/main/$l.traineddata" -OutFile "bundle\tesseract\tessdata\$l.traineddata"
          }
          Get-ChildItem bundle\tesseract, bundle\tesseract\tessdata | Format-Table Name, Length

      - name: Check the engine from the bundle
        shell: pwsh
        timeout-minutes: 10
        run: |
          $env:PDF2WORD_TESSERACT = (Resolve-Path bundle\tesseract\tesseract.exe).Path
          $env:PDF2WORD_TESSDATA = (Resolve-Path bundle\tesseract\tessdata).Path
          python tests/make_scan.py test_scan.pdf
          python -m pdf2word test_scan.pdf -o result.docx
          python tests/check_docx.py result.docx test_scan.txt

      - name: Build EXE
        shell: pwsh
        timeout-minutes: 20
        run: |
          python tools/make_icon.py app.ico
          $common = @(
            "--noconfirm", "--windowed", "--icon", "app.ico",
            "--add-data", "app.ico;.",
            "--add-data", "bundle\tesseract;tesseract",
            "--collect-all", "tkinterdnd2",
            "--collect-all", "pypdfium2",
            "--collect-all", "pypdfium2_raw",
            "--collect-data", "docx",
            "--exclude-module", "matplotlib",
            "--exclude-module", "scipy",
            "--exclude-module", "pandas"
          )
          pyinstaller @common --onefile --name PDFtoWord pdf2word_app.py
          pyinstaller @common --onedir --name PDFtoWord-portable pdf2word_app.py
          Compress-Archive -Path dist\PDFtoWord-portable -DestinationPath dist\PDFtoWord-portable.zip
          Get-ChildItem dist | Format-Table Name, Length

      - name: Smoke test of the EXE
        timeout-minutes: 15
        run: |
          python tests/smoke_exe.py dist/PDFtoWord.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PDFtoWord
          path: dist/PDFtoWord.exe
          if-no-files-found: error

      - name: Upload portable version
        uses: actions/upload-artifact@v4
        with:
          name: PDFtoWord-portable
          path: dist/PDFtoWord-portable.zip
          if-no-files-found: error
