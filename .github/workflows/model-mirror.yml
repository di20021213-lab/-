name: AI Helper - model mirror

# Puts a copy of the qwen2.5:7b model file (GGUF from Hugging Face) into Releases of
# this repository, split into parts under GitHub's 2 GB limit. The helper downloads
# it from here when the Ollama registry and Hugging Face are unreachable.
# Model: Qwen2.5-7B-Instruct by Alibaba Cloud (Apache 2.0), GGUF by bartowski.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/local-command-bot-qbm4mu
    paths:
      - ".github/workflows/model-mirror.yml"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: model-qwen2.5-7b
      FILE: Qwen2.5-7B-Instruct-Q4_K_M.gguf
      URL: https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf
      SHA256: 65b8fcd92af6b4fefa935c625d1ac27ea29dcb6ee14589c55a8f115ceaaa1423
      # must match GITHUB_MODEL_PARTS in agent.py
      PART_SIZE: 1610612736
      PARTS: 3
    steps:
      - name: Check whether the mirror already exists
        id: check
        run: |
          count=$(gh release view "$TAG" --json assets --jq "[.assets[].name | select(startswith(\"$FILE.\"))] | length" 2>/dev/null || echo 0)
          echo "assets: $count"
          if [ "$count" = "$PARTS" ]; then echo "done=1" >> "$GITHUB_OUTPUT"; fi

      - name: Download and verify
        if: steps.check.outputs.done != '1'
        run: |
          df -h .
          curl -fL --retry 5 --retry-delay 5 -C - -o model.gguf "$URL"
          echo "$SHA256  model.gguf" | sha256sum -c -

      - name: Split into parts
        if: steps.check.outputs.done != '1'
        run: |
          split -b "$PART_SIZE" -d -a 3 --numeric-suffixes=1 model.gguf "$FILE."
          rm model.gguf
          ls -l "$FILE".*
          [ "$(ls "$FILE".* | wc -l)" = "$PARTS" ]
          [ "$(cat "$FILE".* | sha256sum | cut -d' ' -f1)" = "$SHA256" ]

      - name: Publish to Releases
        if: steps.check.outputs.done != '1'
        run: |
          cat > notes.md <<'EOF'
          Копия файла нейросети для ИИ-помощника: он скачивает её отсюда сам, если сервер моделей Ollama и Hugging Face недоступны. Вручную скачивать не нужно.

          Модель: Qwen2.5-7B-Instruct (Alibaba Cloud), лицензия Apache 2.0. Файл: Qwen2.5-7B-Instruct-Q4_K_M.gguf из bartowski/Qwen2.5-7B-Instruct-GGUF на Hugging Face, разрезан на части (GitHub не принимает файлы больше 2 ГБ). SHA-256 целого файла: 65b8fcd92af6b4fefa935c625d1ac27ea29dcb6ee14589c55a8f115ceaaa1423
          EOF
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$FILE".* \
            --target "$GITHUB_SHA" \
            --title "Нейросеть qwen2.5:7b для ИИ-помощника" \
            --notes-file notes.md \
            --latest=false
